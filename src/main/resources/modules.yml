# ============================================================
# EasyEvents Modules
# ============================================================
#
# Each EasyEvents feature can be enabled or disabled here.
#
# All modules are enabled by default.
#
# After changing this file run:
#
#   /ee reload
#
# or:
#
#   /easyevents reload
#
#
# Storage is core infrastructure and is therefore not a
# disable-able module.
#
# Storage configuration remains in config.yml.
#
# ============================================================

modules:

  # ==========================================================
  # Calendar
  # ==========================================================
  #
  # Uses:
  #
  #   calendar.yml
  #
  # Provides date-based recurring and one-time announcements.
  #
  calendar:

    enabled: true


  # ==========================================================
  # Daily Login
  # ==========================================================
  #
  # Uses:
  #
  #   daily.yml
  #
  # Provides consecutive daily login rewards.
  #
  daily-login:

    enabled: true


  # ==========================================================
  # Auto Broadcast
  # ==========================================================
  #
  # Uses:
  #
  #   broadcasts.yml
  #
  # Rotates configurable server announcements automatically.
  #
  auto-broadcast:

    enabled: true


  # ==========================================================
  # Player Milestones
  # ==========================================================
  #
  # Uses:
  #
  #   milestones.yml
  #
  # Triggers announcements and commands when configurable
  # online-player thresholds are reached.
  #
  player-milestones:

    enabled: true


  # ==========================================================
  # Random Events
  # ==========================================================
  #
  # Uses:
  #
  #   random-events.yml
  #
  # Periodically rolls configurable chances for server-wide
  # events.
  #
  random-events:

    enabled: true