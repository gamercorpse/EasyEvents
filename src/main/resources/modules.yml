# ============================================================
# EasyEvents Modules
# ============================================================
#
# Each EasyEvents feature can be enabled or disabled here.
#
# All modules are enabled by default.
#
# After changing this file run:
#
#   /ee reload
#
# or:
#
#   /easyevents reload
#
# Storage is core infrastructure and is therefore not a
# disable-able module.
#
# ============================================================

modules:

  # ==========================================================
  # Calendar
  # ==========================================================
  #
  # Configuration:
  #
  #   calendar.yml
  #
  calendar:
    enabled: true


  # ==========================================================
  # Daily Login
  # ==========================================================
  #
  # Configuration:
  #
  #   daily.yml
  #
  daily-login:
    enabled: true


  # ==========================================================
  # Auto Broadcast
  # ==========================================================
  #
  # Configuration:
  #
  #   broadcasts.yml
  #
  auto-broadcast:
    enabled: true


  # ==========================================================
  # Player Milestones
  # ==========================================================
  #
  # Configuration:
  #
  #   milestones.yml
  #
  player-milestones:
    enabled: true


  # ==========================================================
  # Random Events
  # ==========================================================
  #
  # Configuration:
  #
  #   random-events.yml
  #
  random-events:
    enabled: true


  # ==========================================================
  # Join Events
  # ==========================================================
  #
  # Configuration:
  #
  #   join-events.yml
  #
  # Supports separate actions for:
  #
  # - first-time players
  # - returning players
  #
  join-events:
    enabled: true


  # ==========================================================
  # Death Events
  # ==========================================================
  #
  # Configuration:
  #
  #   death-events.yml
  #
  # Can broadcast configurable death announcements and
  # execute console commands when players die.
  #
  death-events:
    enabled: true


  # ==========================================================
  # Advancement Events
  # ==========================================================
  #
  # Configuration:
  #
  #   advancement-events.yml
  #
  # Lets the administrator associate specific Minecraft
  # advancements with messages, broadcasts, and commands.
  #
  advancement-events:
    enabled: true